<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orakel · SYNCCORE · 243</title>

    <style>
        /* ─── Dein SYNCCORE-Stil ─── */
        body {
            background: #0a0a0a;
            color: #c0c0c0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .oracle-container {
            max-width: 780px;
            width: 100%;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 30px 30px 40px;
            box-shadow: 0 0 40px rgba(0, 255, 200, 0.03);
            transition: border-color 0.3s;
        }

        .oracle-container:hover {
            border-color: #3a5a5a;
        }

        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 0.15em;
            color: #d0d0d0;
            text-align: center;
            margin-top: 0;
            margin-bottom: 0.25rem;
            border-bottom: 1px solid #222;
            padding-bottom: 0.75rem;
        }

        h1 small {
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 0.1em;
            display: block;
            margin-top: 4px;
        }

        .status-line {
            text-align: center;
            color: #558;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 0.6rem;
        }

        /* ─── SET-Matrix visuell ─── */
        .set-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 210px;
            margin: 1.2rem auto 1.8rem auto;
        }

        .set-cell {
            background: #181818;
            color: #6a8a8a;
            text-align: center;
            padding: 10px 0;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            border: 1px solid #252525;
            transition: background 0.2s, color 0.2s;
        }

        .set-cell.hall {
            background: #1e2a2a;
            color: #aadddd;
            border-color: #3a5a5a;
            box-shadow: 0 0 12px rgba(0, 200, 180, 0.05);
        }

        /* ─── Eingabe ─── */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 1.8rem 0 1.8rem 0;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .input-row label {
            color: #889;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
        }

        .input-row input {
            background: #151515;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 10px 14px;
            color: #d0d0d0;
            font-family: inherit;
            font-size: 0.95rem;
            width: 200px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-row input:focus {
            border-color: #4a7a7a;
            box-shadow: 0 0 14px rgba(0, 200, 180, 0.06);
        }

        .input-row input::placeholder {
            color: #3a4a4a;
            font-size: 0.8rem;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #2a3a3a;
            border-radius: 6px;
            padding: 10px 22px;
            color: #b0c0c0;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .btn:hover {
            background: #222;
            border-color: #3a6a6a;
            color: #d0f0f0;
        }

        .btn:active {
            background: #1a2a2a;
        }

        /* ─── Orakel-Ausgabe ─── */
        .oracle-output {
            background: #0c0c0c;
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            padding: 18px 20px;
            margin: 1.4rem 0 0.8rem 0;
            min-height: 100px;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: #b0b8b8;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .oracle-output .highlight {
            color: #aadddd;
            font-weight: 400;
        }

        .oracle-output .meta {
            color: #6a7a7a;
            font-size: 0.75rem;
        }

        .oracle-output .status-ok {
            color: #7aaa8a;
        }

        .oracle-output .status-open {
            color: #aab07a;
        }

        .footnote {
            text-align: center;
            font-size: 0.65rem;
            color: #3a4a4a;
            letter-spacing: 0.06em;
            margin-top: 1.8rem;
            border-top: 1px solid #161616;
            padding-top: 1rem;
        }

        .footnote span {
            color: #4a6a6a;
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .oracle-container {
                padding: 18px 16px 28px;
            }
            h1 {
                font-size: 1.4rem;
            }
            .input-row input {
                width: 100%;
            }
            .set-grid {
                max-width: 150px;
            }
            .set-cell {
                font-size: 0.9rem;
                padding: 6px 0;
            }
        }
    </style>
</head>

<body>

<div class="oracle-container">

    <h1>
        ◈ ORAKEL · 243
        <small>SYNCCORE · SET · QI/IQQ · RESPO_81</small>
    </h1>

    <div class="status-line">
        〈 lerSETI · argeupheria · hall 〉
    </div>

    <!-- ─── SET-Matrix ─── -->
    <div class="set-grid" id="setGrid">
        <div class="set-cell">a</div>
        <div class="set-cell">b</div>
        <div class="set-cell">c</div>
        <div class="set-cell">d</div>
        <div class="set-cell hall" id="hallCell">e</div>
        <div class="set-cell">f</div>
        <div class="set-cell">g</div>
        <div class="set-cell">h</div>
        <div class="set-cell">i</div>
    </div>

    <!-- ─── Eingabe ─── -->
    <div class="input-area">
        <div class="input-row">
            <label for="oracleInput">◈ Frage / Zahl</label>
            <input type="text" id="oracleInput" placeholder="z.B. 81, 243, oder deine Frage" value="81">
        </div>
        <div class="input-row" style="justify-content: center; gap: 12px;">
            <button class="btn" id="askBtn">↻ Orakel befragen</button>
            <button class="btn" id="resetBtn">⟲ SET zurücksetzen</button>
        </div>
    </div>

    <!-- ─── Orakel-Ausgabe ─── -->
    <div class="oracle-output" id="oracleOutput">
        <span class="meta">// bereit …</span>
    </div>

    <div class="footnote">
        <span>QI/IQQ</span> · <span>81</span> · <span>243</span> · <span>RESPO_WHIRL</span>
    </div>

</div>

<script type="importmap">
    {
        "imports": {
            "./SET.js": "./SET.js",
            "./RESPO_81_FINDER.js": "./RESPO_81_FINDER.js",
            "./QI_IQQ_REFERENZ.js": "./QI_IQQ_REFERENZ.js"
        }
    }
<script type="module">
    import { SET, syncQiIqqWith81 } from './SET.js';
    import { RESPO_81_FINDER } from './RESPO_81_FINDER.js';

    const out = document.getElementById('oracleOutput');
    const inp = document.getElementById('oracleInput');
    const hall = document.getElementById('hallCell');

    // ─────────────────────────────────────────────
    // SET-Matrix anzeigen
    // ─────────────────────────────────────────────
    function renderSet() {
        const flat = SET.base.flat();
        document.querySelectorAll('.set-cell').forEach((cell, i) => {
            cell.textContent = flat[i];
        });
        hall.textContent = SET.hall();
    }

    // ─────────────────────────────────────────────
    // Text → numerische Essenz
    // ─────────────────────────────────────────────
    const essence = v =>
        isNaN(v) ? [...v].reduce((a, c) => a + c.charCodeAt(0), 0) : Number(v);

    // ─────────────────────────────────────────────
    // Ausgabe formatieren
    // ─────────────────────────────────────────────
    function fmt(r) {
        if (!r) return '// keine Antwort';

        const L = [];
        L.push(`◈ ORAKEL · ${new Date().toLocaleTimeString()}`);

        if (r.qi) {
            L.push(`├─ QI/IQQ: ${r.qi.path || 'offen'}`);
            L.push(`│  └─ 243: ${r.qi.is243 ? 'erreicht' : 'offen'}`);
        }

        const f = r.find81;
        if (f) {
            L.push(`├─ 81-Findung: ${f.find81.count}/3`);
            if (f.find81.is243) L.push(`│  └─ ${f.find81.status}`);

            L.push(`├─ Station: ${f.station.station} → ${f.station.percent}%`);
            L.push(`│  └─ ${f.station.status}`);

            if (f.beneficial.length) {
                L.push(`├─ Begünstigung:`);
                f.beneficial.forEach(b => L.push(`│  • ${b}`));
            }
        }

        L.push(`└─ Status: ${r.status || 'offen'}`);
        return L.join('\n');
    }

    // ─────────────────────────────────────────────
    // Hall-Resonanz
    // ─────────────────────────────────────────────
    function updateHall(is243) {
        hall.style.background = is243 ? '#1e3a3a' : '#1e2a2a';
        hall.style.color = is243 ? '#b0f0f0' : '#aadddd';
        hall.style.borderColor = is243 ? '#4a8a8a' : '#3a5a5a';
    }

    // ─────────────────────────────────────────────
    // Orakel-Abfrage
    // ─────────────────────────────────────────────
    function ask() {
        const raw = inp.value.trim();
        if (!raw) return out.textContent = '⚠️ Eingabe fehlt.';

        const num = essence(raw);

        const station = {
            name: "SYNCCORE-Station",
            uptime: 0.91,
            signal: 0.87,
            response: 0.94,
            sync: 0.79,
            load: 0.33,
            errors: 1
        };

        try {
            const r = syncQiIqqWith81(num, station);
            out.textContent = fmt(r);
            updateHall(r.find81?.find81?.is243);
        } catch (e) {
            out.textContent = `❌ Fehler: ${e.message}`;
        }
    }

    // ─────────────────────────────────────────────
    // Events
    // ─────────────────────────────────────────────
    document.getElementById('askBtn').onclick = ask;

    document.getElementById('resetBtn').onclick = () => {
        inp.value = '81';
        out.innerHTML = '<span class="meta">// zurückgesetzt …</span>';
        renderSet();
        updateHall(false);
    };

    inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') ask();
    });

    // ─────────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────────
    renderSet();
    out.innerHTML = `<span class="meta">// Orakel bereit. Stelle deine Frage.</span>`;
</script>


</body>
</html>
